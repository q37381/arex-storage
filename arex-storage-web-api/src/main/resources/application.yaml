spring:
  application:
    name: AREX's Storage Web API Spring Boot
  autoconfigure:
    # redisson-spring-boot-starter auto-config unconditionally connects to
    # localhost:6379 at startup; our own RedisAutoConfiguration wires the client
    # only when arex.cache.provider=redis, so disable the starter here.
    exclude: org.redisson.spring.starter.RedissonAutoConfigurationV2
  datasource:
    url: ${AREX_MYSQL_URL:jdbc:mysql://localhost:3306/arex_storage_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${AREX_MYSQL_USER:root}
    password: ${AREX_MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false
    default-property-inclusion: non_null
  profiles:
    active: prod
mybatis:
  configuration:
    map-underscore-to-camel-case: true
# for report
arex:
  storage:
    # persistence backend: mysql | mongodb(legacy)
    repository:
      type: ${AREX_REPOSITORY_TYPE:mysql}
  cache:
    # cache/lock provider: local(in-process, single instance) | redis(shared, multi instance)
    provider: ${AREX_CACHE_PROVIDER:local}
  app:
    auth:
      switch: false
  query:
    config:
      url: ${arex.api.service.api:http://arex-api-service:8080}/api/config/comparison/summary/queryConfigOfCategory
    schedule:
      url: ${arex.api.service.api:http://arex-api-service:8080}/api/config/schedule/useResult/appId/%s
  config:
    # default for application settings
    application:
      provider: ''
      service:
        provider: ''
    default:
      # default for service collect settings
      schedule:
        offsetDays: 1
        sendMaxQps: 20
        targetEnv: ''
      # default for replay schedule settings
      service:
        collect:
          allowDayOfWeeks: 127
          allowTimeOfDayFrom: 00:01
          allowTimeOfDayTo: '23:59'
          sampleRate: 1
          timeMock: true
      compare:
        # to insert default ignoredCategoryTypes when create app
        ignoredCategoryTypes: [ { operationType: Redis }, { operationType: QMessageConsumer }, { operationType: DynamicClass } ]
    mockerConvert:
      enabled: true
  prometheus:
    port: 20093
  common:
    record:
      payload:
        with:
          metric: false
  schedule:
    updateCaseStatus:
      url: ${arex.schedule.service.url:http://arex-schedule-service:8080}/api/updateCaseStatus
pom:
  version: ${project.version}
maxSqlLength: 5000